name: boundary-validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: |
          rustup toolchain install 1.85.1 --profile minimal
          rustup override set 1.85.1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.100'
      - name: Native prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev binutils
      - name: Boundary and adapter tests
        id: boundary
        run: bash scripts/check.sh
      - name: Clock, scheduler, interrupted sleep and host fault tests
        run: bash scripts/services.sh
      - name: Actual NativeAOT GC negative and positive controls
        run: bash scripts/nativeaot.sh
      - name: Freestanding ARM64 boundary compile
        if: ${{ !cancelled() && steps.boundary.outcome == 'success' }}
        run: |
          rustup target add aarch64-unknown-none
          cargo build --release --no-default-features --features host --target aarch64-unknown-none
      - uses: actions/checkout@v4
        if: ${{ !cancelled() && steps.boundary.outcome == 'success' }}
        with:
          repository: dotnet/runtime
          ref: 60629d14374c56f1cb51819049ad1fa529307f8d
          path: artifacts/runtime
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /src/coreclr/gc/unix/gcenv.unix.cpp
            /src/coreclr/nativeaot/Runtime/CMakeLists.txt
      - name: Validate source-patch applicability, not a runtime source build
        if: ${{ !cancelled() && steps.boundary.outcome == 'success' }}
        run: |
          python3 integration/dotnet10/patch_runtime.py artifacts/runtime --check
          python3 integration/dotnet10/patch_runtime.py artifacts/runtime
          git -C artifacts/runtime diff --check

  wasm:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Toolchain
        run: |
          rustup toolchain install 1.85.1 --profile minimal
          rustup override set 1.85.1
          rustup target add wasm32-unknown-unknown wasm32-wasip1 wasm32v1-none
          sudo apt-get update && sudo apt-get install -y clang lld
      - name: Execute C to Rust boundary in three Wasm target modules
        run: bash scripts/wasm.sh
      - name: Real WASIp1 clock import and injected failure
        run: bash scripts/wasi-clock.sh
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: wasm-boundary-modules
          path: artifacts/wasm/*.wasm
          if-no-files-found: error

  freestanding:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build host boundary without std or 64-bit atomics
        run: |
          rustup toolchain install 1.85.1 --profile minimal
          rustup override set 1.85.1
          for target in aarch64-unknown-none riscv64gc-unknown-none-elf thumbv7em-none-eabi; do
            rustup target add "$target"
            cargo build --release --no-default-features --features host --target "$target"
            cargo build --release --no-default-features --features host-services --target "$target"
          done

  source-runtime:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: dotnet/runtime
          ref: 60629d14374c56f1cb51819049ad1fa529307f8d
          path: artifacts/runtime-source
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.100'
      - name: Build prerequisites
        run: |
          rustup toolchain install 1.85.1 --profile minimal
          rustup override set 1.85.1
          sudo apt-get update
          sudo apt-get install -y clang llvm lld cmake ninja-build python3 libicu-dev liblttng-ust-dev libunwind-dev libssl-dev libkrb5-dev zlib1g-dev
      - name: Rebuild native runtime; verify VM and clock calls without linker wrapping
        run: bash scripts/source-runtime.sh artifacts/runtime-source
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: source-runtime-evidence-${{ matrix.runner }}
          path: |
            artifacts/source-build.log
            artifacts/source-undefined.txt
            artifacts/source-*-symbols.txt
            artifacts/source-*-run.log
            artifacts/source-manifest.json
          if-no-files-found: warn
