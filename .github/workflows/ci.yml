name: boundary-validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup override set 1.98.1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - name: Native prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev binutils
      - name: Library crates, std port and build helper
        run: |
          cargo test -p dotnet-pal-rs --lib --no-default-features
          cargo test -p dotnet-pal-std
          cargo test -p dotnet-pal-memfs
          cargo check -p dotnet-pal-build
      - name: Boundary and adapter tests
        id: boundary
        run: bash scripts/check.sh
      - name: Clock, scheduler, interrupted sleep and host fault tests
        run: bash scripts/services.sh
      - name: Synchronization, thread, TLS, stack and process-barrier contracts
        run: bash scripts/kernel.sh
      - name: Runtime OS services and host contracts
        run: bash scripts/runtime.sh
      - name: Native helper heap, rwlocks, diagnostics and failure contracts
        run: bash scripts/support.sh
      - name: Topology, process and image groups
        run: bash scripts/platform.sh
      - name: Files and directories against the kernel
        run: bash scripts/files.sh
      - name: Sockets, poll and wake channels over loopback
        run: bash scripts/sockets.sh
      - name: CPU faults reported, edited and resumed through a host table
        run: bash scripts/faults.sh
      - name: Environment enumeration, OS and user facts, process times
        run: bash scripts/system.sh
      - name: Signals reported as notifications from a dispatcher thread
        run: bash scripts/notifications.sh
      - name: Child processes, pipes, exit codes and termination
        run: bash scripts/processes.sh
      - name: Terminal size, input modes and control characters on a pseudo-terminal
        run: bash scripts/terminal.sh
      - name: File and directory change events against inotify
        run: bash scripts/watches.sh
      - name: Shared and private file mappings
        run: bash scripts/mappings.sh
      - name: Mount points and free space
        run: bash scripts/volumes.sh
      - name: Network interfaces, reverse lookup and multicast membership
        run: bash scripts/network.sh
      - name: Unix domain sockets
        run: bash scripts/local-sockets.sh
      - name: Accounts and group lists
        run: bash scripts/accounts.sh
      - name: Process priorities
        run: bash scripts/priority.sh
      - name: Native signal and activation contracts
        run: bash scripts/context.sh
      - name: Demand-allocated linear storage and eight-thread failure contracts
        run: bash scripts/linear-heap.sh
      - name: Actual NativeAOT GC negative and positive controls
        run: bash scripts/nativeaot.sh
      - name: Freestanding ARM64 boundary compile
        if: ${{ !cancelled() && steps.boundary.outcome == 'success' }}
        run: |
          rustup target add aarch64-unknown-none
          cargo rustc --lib --crate-type staticlib --release --no-default-features --features host --target aarch64-unknown-none
      - uses: actions/checkout@v4
        if: ${{ !cancelled() && steps.boundary.outcome == 'success' }}
        with:
          repository: dotnet/runtime
          ref: 4271d88e0aebf3d04f188f1334c2220d80555ef6
          path: artifacts/runtime
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /src/coreclr/gc/unix/gcenv.unix.cpp
            /src/coreclr/gc/env/gcenv.os.h
            /src/coreclr/gc/unix/events.cpp
            /src/coreclr/nativeaot/Runtime/CMakeLists.txt
            /src/coreclr/nativeaot/Runtime/unix/PalUnix.cpp
            /src/coreclr/nativeaot/Runtime/unix/UnixSignals.cpp
            /src/coreclr/nativeaot/Runtime/unix/UnixSignals.h
            /src/coreclr/nativeaot/Runtime/unix/PalCreateDump.cpp
            /src/native/external/llvm-libunwind/src/libunwind.cpp
            /src/native/external/llvm-libunwind/src/RWMutex.hpp
            /src/native/external/llvm-libunwind/src/config.h
            /src/native/external/llvm-libunwind/src/UnwindCursor.hpp
            /src/coreclr/nativeaot/Runtime/thread.cpp
            /src/coreclr/nativeaot/Runtime/Crst.h
            /src/coreclr/nativeaot/Runtime/Crst.cpp
            /src/coreclr/nativeaot/Runtime/unix/HardwareExceptions.cpp
            /src/coreclr/nativeaot/Runtime/unix/cgroupcpu.cpp
            /src/coreclr/gc/unix/cgroup.cpp
            /src/coreclr/gc/unix/numasupport.cpp
            /src/coreclr/gc/env/gcenv.structs.h
            /src/native/external/llvm-libunwind/src/AddressSpace.hpp
            /src/native/minipal/time.c
            /src/native/minipal/thread.h
            /src/native/minipal/debugger.c
            /src/native/minipal/random.c
            /src/native/minipal/log.c
            /src/native/minipal/mutex.h
            /src/native/minipal/mutex.c
            /src/native/minipal/cpucount.c
            /src/native/minipal/cpufeatures.c
            /src/native/minipal/CMakeLists.txt
      - name: Validate source-patch applicability, not a runtime source build
        if: ${{ !cancelled() && steps.boundary.outcome == 'success' }}
        run: |
          python3 integration/dotnet10/patch_runtime.py artifacts/runtime --check
          python3 integration/dotnet10/patch_runtime.py artifacts/runtime
          git -C artifacts/runtime diff --check

  wasm:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup override set 1.98.1
          rustup target add wasm32-unknown-unknown wasm32-wasip1 wasm32v1-none
          sudo apt-get update && sudo apt-get install -y clang lld
      - name: Execute C to Rust boundary in three Wasm target modules
        run: bash scripts/wasm.sh
      - name: Real WASIp1 clock import and injected failure
        run: |
          bash scripts/wasi-clock.sh
          bash scripts/wasi-runtime.sh
          bash scripts/wasi-bridge.sh
      - name: Browser port example in Node and in headless Chrome
        run: BROWSER_BIN="$(command -v google-chrome)" bash examples/browser-port/run.sh
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: wasm-boundary-modules
          path: |
            artifacts/wasm/*.wasm
            examples/browser-port/artifacts/*.wasm
            examples/browser-port/artifacts/*.html
            examples/browser-port/artifacts/*.log
          if-no-files-found: error

  freestanding:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build host boundary without std or 64-bit atomics
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup override set 1.98.1
          for target in aarch64-unknown-none riscv64gc-unknown-none-elf thumbv7em-none-eabi; do
            rustup target add "$target"
            for profile in host host-services host-kernel host-support linear-heap; do
              cargo rustc --lib --crate-type staticlib --release --no-default-features --features "$profile" --target "$target"
            done
          done
      - name: Bare-metal AArch64 port table test under QEMU
        run: |
          sudo apt-get update && sudo apt-get install -y clang lld qemu-system-arm
          bash examples/baremetal-aarch64/run-qemu.sh
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: baremetal-table-test
          path: examples/baremetal-aarch64/artifacts/qemu.log
          if-no-files-found: error

  source-runtime:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: dotnet/runtime
          ref: 4271d88e0aebf3d04f188f1334c2220d80555ef6
          path: artifacts/runtime-source
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - name: Build prerequisites
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup override set 1.98.1
          sudo apt-get update
          sudo apt-get install -y clang llvm lld cmake ninja-build python3 time libicu-dev liblttng-ust-dev libunwind-dev libssl-dev libkrb5-dev zlib1g-dev
      - name: Rebuild and qualify both native GC profiles without linker wrapping
        run: bash scripts/source-runtime.sh artifacts/runtime-source
      - name: Console probe with the boundary's System.Native
        run: bash scripts/console-probe.sh
      - name: Files, sockets and null references from C# with the boundary's System.Native
        run: bash scripts/io-probe.sh
      - name: Processes, signal registrations, system facts, links and locks from C#
        run: bash scripts/system-probe.sh
      - name: FileSystemWatcher, MemoryMappedFile, DriveInfo, NetworkInterface and named pipes from C#
        run: bash scripts/facilities-probe.sh
      - name: System.Console on a pseudo-terminal
        run: bash scripts/terminal-probe.sh
      - name: System.Native ABI pin check
        run: DOTNET_PAL_RUNTIME_SOURCE=artifacts/runtime-source python3 -m unittest tests.test_system_native_abi
      - name: Freestanding C runtime self-test against glibc
        if: ${{ matrix.runner == 'ubuntu-24.04-arm' }}
        run: bash native/freestanding/selftest.sh
      - name: Bare-metal AArch64 managed image under QEMU
        if: ${{ matrix.runner == 'ubuntu-24.04-arm' }}
        run: |
          sudo apt-get install -y qemu-system-arm
          rustup target add aarch64-unknown-none
          bash examples/baremetal-aarch64/build-app.sh ConsoleProbe
          bash examples/baremetal-aarch64/build-app.sh IoProbe
          bash examples/baremetal-aarch64/build-app.sh SystemProbe
          bash examples/baremetal-aarch64/build-app.sh FacilitiesProbe
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: source-runtime-evidence-${{ matrix.runner }}
          path: |
            artifacts/source-build.log
            artifacts/source-*-undefined.txt
            artifacts/source-manifest.json
            artifacts/qualification/**/*.log
            artifacts/qualification/**/symbols.txt
            artifacts/qualification/*-benchmark.json
            artifacts/console-probe/run.log
            artifacts/console-probe/dependency-inventory.log
            artifacts/io-probe/run.log
            artifacts/io-probe/dependency-inventory.log
            artifacts/system-probe/run.log
            artifacts/system-probe/dependency-inventory.log
            artifacts/facilities-probe/run.log
            artifacts/facilities-probe/dependency-inventory.log
            artifacts/terminal-probe/run.log
            artifacts/terminal-probe/dependency-inventory.log
            examples/baremetal-aarch64/artifacts/app-*/qemu.log
            examples/baremetal-aarch64/artifacts/app-*/app.map
          if-no-files-found: error
