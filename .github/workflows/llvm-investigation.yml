name: llvm-managed-investigation
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/llvm-investigation.yml', 'scripts/llvm-investigate.sh', 'samples/LlvmGcProbe/**', 'integration/llvm-wasi/**']
permissions:
  contents: read
jobs:
  managed-wasi-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.100'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify WASI SDK and execute managed baseline
        shell: bash
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/llvm-packages
        run: |
          set -euo pipefail
          mkdir -p artifacts/llvm "$RUNNER_TEMP/llvm-sdk"
          curl --fail --location --retry 3 --max-time 300 https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-29/wasi-sdk-29.0-x86_64-linux.tar.gz -o "$RUNNER_TEMP/llvm-sdk/sdk.tar.gz"
          printf '87d1d1a2879d139cdc624b968efad3d4a97b8078cdff95e63ac88ecafd1a0171  %s\n' "$RUNNER_TEMP/llvm-sdk/sdk.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/llvm-sdk/sdk.tar.gz" -C "$RUNNER_TEMP/llvm-sdk"
          export WASI_SDK_PATH="$RUNNER_TEMP/llvm-sdk/wasi-sdk-29.0-x86_64-linux"
          bash scripts/llvm-investigate.sh
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: llvm-managed-discovery
          path: |
            artifacts/llvm/*.txt
            artifacts/llvm/*.json
            artifacts/llvm/*.log
            artifacts/llvm/publish/*.wasm
          if-no-files-found: error
          retention-days: 3
