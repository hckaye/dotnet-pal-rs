name: platform-split-inputs
on:
  push:
    branches: ['refactor/platform-crates']
    paths: ['.github/workflows/platform-split-inputs.yml']
permissions:
  contents: read
jobs:
  inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Package dependency sources for offline refactoring tests
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          mkdir -p artifacts/refactor-inputs
          cargo +1.98.1 vendor --versioned-dirs artifacts/vendor > artifacts/refactor-inputs/config.toml
          tar -czf artifacts/refactor-inputs/vendor.tar.gz -C artifacts vendor
          sha256sum artifacts/refactor-inputs/vendor.tar.gz > artifacts/refactor-inputs/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: platform-split-inputs
          path: artifacts/refactor-inputs/
          retention-days: 3
          if-no-files-found: error
