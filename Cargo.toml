[package]
name = "dotnet-pal-rs"
version = "0.1.0"
edition = "2021"
description = "Experimental Rust PAL for NativeAOT portability research"
license = "MIT"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
libc = "0.2"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
