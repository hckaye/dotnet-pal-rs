[package]
name = "dotnet-pal-rs"
version = "0.6.0"
edition = "2021"
rust-version = "1.85"
description = "Experimental no_std OS boundary for NativeAOT portability research"
license = "MIT"

[lib]
crate-type = ["staticlib", "rlib"]

[features]
default = ["linux"]
linux = ["dep:libc"]
host = []
# Optional native helper services; legacy host configurations remain unchanged.
host-support = ["host"]
host-images = ["host"]
linear = []
# On-demand storage supplied by the embedder; shares the native C heap on WASI.
linear-heap = ["linear"]
# Explicit bounded managed-heap experiment; the default boundary arena stays 8 MiB.
linear-gc = ["linear"]
# Small real arena for managed OOM qualification; not GCHeapHardLimit (64-bit only).
linear-gc-small = ["linear-gc"]
host-services = ["host"]
host-kernel = ["host-services"]
host-runtime = ["host-kernel"]
host-context = ["host-runtime"]
wasi-runtime = ["wasi-clock"]
wasi-dispatch = ["wasi-runtime"]
wasi-clock = ["linear"]

[dependencies]
libc = { version = "=0.2.169", default-features = false, optional = true }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = false
codegen-units = 1
