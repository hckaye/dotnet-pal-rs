[package]
name = "dotnet-pal-rs"
version = "0.7.0"
edition = "2021"
rust-version = "1.98"
description = "Platform-independent no_std NativeAOT PAL contracts and C ABI"
license = "MIT"
repository = "https://github.com/hckaye/dotnet-pal-rs"
include = ["src/**", "include/**", "Cargo.toml", "README.md", "LICENSE"]

[workspace]
members = ["crates/*", "examples/browser-port", "tools/dotnet-pal-standalone"]
# A plain cargo build/test operates on the core, not every platform.
default-members = ["."]
resolver = "2"

[lib]
crate-type = ["rlib"]

[features]
default = []

[dependencies]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = false
codegen-units = 1
