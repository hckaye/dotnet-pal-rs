[package]
name = "dotnet-pal-rs"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
description = "Experimental no_std OS boundary for NativeAOT portability research"
license = "MIT"

[lib]
crate-type = ["staticlib", "rlib"]

[features]
default = ["linux"]
linux = ["dep:libc"]
host = []
# Single-threaded, non-shared WASM reference implementation, not native VM.
arena = []

[dependencies]
libc = { version = "=0.2.169", default-features = false, optional = true }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
# Keep native objects usable by the vendor linker, without Rust LLVM bitcode LTO.
lto = false
codegen-units = 1
