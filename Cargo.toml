[package]
name = "dotnet-pal-rs"
version = "0.5.0"
edition = "2021"
rust-version = "1.85"
description = "Experimental no_std OS boundary for NativeAOT portability research"
license = "MIT"

[lib]
crate-type = ["staticlib", "rlib"]

[features]
default = ["linux"]
linux = ["dep:libc"]
host = []
linear = []
# Explicit bounded managed-heap experiment; the default boundary arena stays 8 MiB.
linear-gc = ["linear"]
host-services = ["host"]
host-kernel = ["host-services"]
wasi-clock = ["linear"]

[dependencies]
libc = { version = "=0.2.169", default-features = false, optional = true }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = false
codegen-units = 1
