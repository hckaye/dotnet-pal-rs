[package]
name = "dotnet-pal-storage"
version = "0.7.0"
edition = "2021"
rust-version = "1.98"
description = "OS-independent arena and ownership-ledger storage providers"
license = "MIT"
repository = "https://github.com/hckaye/dotnet-pal-rs"
include = ["src/**", "Cargo.toml", "README.md", "LICENSE", "native/**"]

[features]
default = []
storage-arena = []
storage-hooks = []
linear-gc = []
linear-gc-small = ["linear-gc"]
[dependencies]
dotnet-pal-rs = { version = "0.7.0", path = "../..", default-features = false }
