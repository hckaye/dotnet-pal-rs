[package]
name = "dotnet-pal-std"
version = "0.7.0"
edition = "2021"
rust-version = "1.98"
description = "Compatibility facade selecting only the current OS PAL crate"
license = "MIT"
repository = "https://github.com/hckaye/dotnet-pal-rs"
include = ["src/**", "Cargo.toml", "README.md", "LICENSE"]

[lib]
crate-type = ["staticlib", "rlib"]

[features]
default = []
entry = ["dotnet-pal-linux-std/entry", "dotnet-pal-macos/entry", "dotnet-pal-windows/entry"]

[target.'cfg(target_os = "linux")'.dependencies]
dotnet-pal-linux-std = { version = "0.7.0", path = "../dotnet-pal-linux-std" }
[target.'cfg(target_os = "macos")'.dependencies]
dotnet-pal-macos = { version = "0.7.0", path = "../dotnet-pal-macos" }
[target.'cfg(target_os = "windows")'.dependencies]
dotnet-pal-windows = { version = "0.7.0", path = "../dotnet-pal-windows" }

[dev-dependencies]
dotnet-pal-rs = { path = "../.." }
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
