[package]
name = "dotnet-pal-std"
version = "0.7.0"
edition = "2021"
rust-version = "1.98"
description = "dotnet-pal-rs port implemented with the Rust standard library for desktop hosts (Linux, macOS, Windows)"
license = "MIT"

[lib]
crate-type = ["staticlib", "rlib"]

[features]
default = []
# Export `dotnet_pal_get_api` from this crate (the ready-made desktop port).
# Leave it off to reuse the providers inside another port.
entry = []

[dependencies]
dotnet-pal-rs = { path = "../..", default-features = false }
getrandom = "0.3"
socket2 = "0.5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_System_Memory", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_SystemInformation", "Win32_Foundation", "Win32_Networking_WinSock", "Win32_System_Console"] }
