[package]
name = "dotnet-pal-windows"
version = "0.7.0"
edition = "2021"
rust-version = "1.98"
description = "windows PAL port on the Rust standard library"
license = "MIT"
repository = "https://github.com/hckaye/dotnet-pal-rs"
include = ["src/**", "Cargo.toml", "README.md", "LICENSE", "native/**"]

[features]
default = []
entry = []
[dependencies]
dotnet-pal-rs = { version = "0.7.0", path = "../..", default-features = false }
dotnet-pal-std-common = { version = "0.7.0", path = "../dotnet-pal-std-common" }
getrandom = "0.3"
socket2 = "0.5"
windows-sys = { version = "0.60", features = ["Win32_System_Memory", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_SystemInformation", "Win32_Foundation", "Win32_Networking_WinSock", "Win32_System_Console"] }
